    <!-- 1. Preconnect to critical origins FIRST (before any other resources) -->

    <!-- 3. Preload critical hero image for LCP optimization -->
    <link rel="preload" as="image" href="/hero.webp" type="image/webp" fetchpriority="high" />
    
    <!-- 4. Preload logo for navbar (small file, high priority for above-fold content) -->

    <!-- 4. Remove unnecessary preloads that cause warnings (resources load naturally) -->
    
    <!-- 5. Inline critical CSS to eliminate render-blocking CSS -->
    <style id="critical-css">
      /* Critical above-the-fold styles - comprehensive to reduce unused CSS blocking */
      :root { 
        --background: 40 25% 97%;
        --foreground: 0 0% 12%;
        --primary: 32 80% 52%;
        --primary-foreground: 0 0% 100%;
        --card: 0 0% 100%;
        --card-foreground: 0 0% 12%;
        --muted: 40 15% 94%;
        --muted-foreground: 0 0% 28%;
        --border: 40 15% 88%;
        --ring: 32 80% 52%;
        --radius: 0.75rem;
      }
      
      * { box-sizing: border-box; margin: 0; padding: 0; }
      
      html { -webkit-text-size-adjust: 100%; }
      
      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        margin: 0;
        padding: 0;
      }
      
      #root { 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        isolation: isolate;
      }
      
      /* Typography */
      h1, h2, h3, h4, h5, h6 { 
        font-family: 'Playfair Display', Georgia, serif;
        margin: 0;
        font-weight: 600;
        line-height: 1.2;
      }
      
      h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
      h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); }
      
      p { margin: 0; line-height: 1.6; }
      a { color: inherit; text-decoration: none; }
      
      /* Navbar */
      nav, header nav { 
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 50;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid hsl(var(--border));
      }
      
      /* Hero Section - Critical for LCP */
      .hero-section, section[class*="hero"] { 
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      
      .hero-section::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
        z-index: 1;
      }
      
      .hero-section > * {
        position: relative;
        z-index: 2;
      }
      
      /* Images */
      img { 
        max-width: 100%; 
        height: auto; 
        display: block;
      }
      
      img[loading="lazy"] { 
        min-height: 200px; 
        content-visibility: auto;
      }
      
      /* Buttons - Critical for interaction */
      button, .btn, [role="button"] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 0.625rem 1.5rem;
        border-radius: calc(var(--radius) - 0.125rem);
        border: none;
        cursor: pointer;
        font-weight: 500;
        font-size: 1rem;
        background: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        transition: opacity 0.2s;
      }
      
      button:hover { opacity: 0.9; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      
      /* Layout utilities */
      .container { 
        max-width: 1536px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      
      .flex { display: flex; }
      .grid { display: grid; }
      .hidden { display: none; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .fixed { position: fixed; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      
      /* Spacing */
      .gap-2 { gap: 0.5rem; }
      .gap-4 { gap: 1rem; }
      .gap-6 { gap: 1.5rem; }
      .p-4 { padding: 1rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
      .mt-4 { margin-top: 1rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      
      /* Flexbox utilities */
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }
      .flex-col { flex-direction: column; }
      
      /* Width/Height */
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .min-h-screen { min-height: 100vh; }
      
      /* Text utilities */
      .text-center { text-align: center; }
      .text-lg { font-size: 1.125rem; }
      .text-xl { font-size: 1.25rem; }
      .text-2xl { font-size: 1.5rem; }
      .text-3xl { font-size: 1.875rem; }
      .font-medium { font-weight: 500; }
      .font-semibold { font-weight: 600; }
      .font-bold { font-weight: 700; }
      
      /* Border & Shadows */
      .rounded-lg { border-radius: 0.5rem; }
      .shadow { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
      
      /* Loading state */
      #root:empty::before {
        content: '';
        display: block;
        width: 40px;
        height: 40px;
        margin: 20vh auto;
        border: 3px solid hsl(var(--muted));
        border-top-color: hsl(var(--primary));
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Accessibility */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    
    <!-- CSS is now handled by Vite - no hardcoded filenames -->
    
    <!-- Optimized async font loading - only critical weights for FCP -->
