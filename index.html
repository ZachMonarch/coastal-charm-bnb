    <!-- 5. Inline critical CSS to eliminate render-blocking CSS -->
    <style id="critical-css">
      /* Minimal critical CSS for FCP - navbar + hero skeleton only */
      :root{--bg:40 25% 97%;--fg:0 0% 12%;--primary:32 80% 52%;--muted:40 15% 94%;--border:40 15% 88%}

      nav,header nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid hsl(var(--border));height:72px}
      .hero-section,section[class*="hero"]{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center}

      .container{max-width:1536px;margin:0 auto;padding:0 1rem}
      #root:empty::before{content:'';display:block;width:40px;height:40px;margin:20vh auto;border:3px solid hsl(var(--muted));border-top-color:hsl(var(--primary));border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
    
    <!-- CSS deferral script - uses MutationObserver to catch Vite-injected CSS -->
    <script>
      // Defer non-critical CSS to eliminate render-blocking
      // Uses MutationObserver since Vite injects CSS dynamically via module script
      (function() {
        function deferCSS(link) {
          if (link.href && link.href.includes('assets/index') && link.rel === 'stylesheet') {
            link.media = 'print';
            link.onload = function() { this.media = 'all'; };
          }
        }
        
        // Handle existing links
        document.querySelectorAll('link[rel="stylesheet"]').forEach(deferCSS);
        
        // Watch for dynamically added links
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName === 'LINK') deferCSS(node);
            });
          });
        });
        
        observer.observe(document.head, { childList: true });
        
        // Disconnect after page load
        window.addEventListener('load', function() {
          setTimeout(function() { observer.disconnect(); }, 1000);
        });
      })();
    </script>
    
    <!-- Optimized font loading - display=swap ensures text visible immediately -->
    <link

    <script>

        });
      }
    </script>
